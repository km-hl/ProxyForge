port: 7890
socks-port: 7891
allow-lan: true
mode: Rule
log-level: info
external-controller: 127.0.0.1:9090

# proxies 留空；ProxyForge 会在这里注入自建节点，机场节点通过 proxy-providers 下发
proxies: []

# include-all 会在最终配置中展开为所有机场 provider 的 use，并加入全部自建节点
proxy-groups:
  - name: 🚀 节点选择
    type: select
    include-all: true
    proxies:
      - ♻️ 自动选择
      - DIRECT

  - name: ♻️ 自动选择
    type: url-test
    include-all: true
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

rules:
  - MATCH,🚀 节点选择
