name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Check repository privacy boundaries
        run: python scripts/check_repository_privacy.py

      - name: Check Python syntax and definite-name errors
        run: ruff check --select E9,F63,F7,F82 .

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Compile application
        run: python -m py_compile main.py

      - name: Check frontend JavaScript syntax
        run: node --check static/app.js

      - name: Check pull request whitespace errors
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"

      - name: Check pushed commit whitespace errors
        if: github.event_name == 'push'
        run: git show --check --oneline --no-renames HEAD
