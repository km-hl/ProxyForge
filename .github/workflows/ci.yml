name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Check repository privacy boundaries
        run: python scripts/check_repository_privacy.py

      - name: Check Python syntax and definite-name errors
        run: ruff check --select E9,F63,F7,F82 .

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Compile application
        run: python -m py_compile main.py network_config.py mihomo_compat.py scripts/check_mihomo.py scripts/download_mihomo.py

      - name: Check frontend JavaScript syntax
        run: |
          node --check static/html-utils.js
          node --check static/rule-utils.js
          node --check static/app.js
          node --check static/network-settings.js
          node --check static/template-session.js

      - name: Run frontend behavior tests
        run: node --test tests/rule_order.test.js tests/html_security.test.js tests/network_settings.test.js tests/template_session.test.js

      - name: Check pull request whitespace errors
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"

      - name: Check pushed commit whitespace errors
        if: github.event_name == 'push'
        run: git show --check --oneline --no-renames HEAD

  mihomo-compatibility:
    name: Mihomo parser compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and verify pinned official Linux amd64 binary
        run: python scripts/download_mihomo.py --output "$RUNNER_TEMP/mihomo"

      - name: Confirm binary version and CLI
        run: |
          "$RUNNER_TEMP/mihomo" -v
          "$RUNNER_TEMP/mihomo" -h

      - name: Check fixtures without external network access
        # Keep loopback (including IPv6) available, but no external interface.
        # Any unexpected geodata/provider download fails instead of using the network.
        run: |
          sudo unshare --net -- bash -euc 'ip link set lo up; exec "$@"' _ \
            "$(command -v python)" scripts/check_mihomo.py \
            --binary "$RUNNER_TEMP/mihomo" --log-dir test-results/mihomo

      - name: Upload parser logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-parser-logs
          path: test-results/mihomo/
          if-no-files-found: warn
          retention-days: 7
