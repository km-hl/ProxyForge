name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip --isolated install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: -r requirements-dev.txt
          python -m pip check

      - name: Check repository privacy boundaries
        run: python scripts/check_repository_privacy.py

      - name: Check Python syntax and definite-name errors
        run: ruff check --select E9,F63,F7,F82 .

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Compile application
        run: python -m compileall -q main.py proxyforge agent scripts

      - name: Check Agent installer syntax
        run: |
          bash -n agent/install.sh
          bash -n agent/install-runtime.sh

      - name: Check frontend JavaScript syntax
        run: |
          node --check static/html-utils.js
          node --check static/rule-utils.js
          node --check static/app.js
          node --check static/network-settings.js
          node --check static/template-session.js
          node --check static/template-history.js
          node --check static/agents.js
          node --check static/managed-nodes.js

      - name: Run frontend behavior tests
        run: node --test tests/rule_order.test.js tests/html_security.test.js tests/network_settings.test.js tests/template_session.test.js tests/agents.test.js tests/managed_nodes.test.js

      - name: Check pull request whitespace errors
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"

      - name: Check pushed commit whitespace errors
        if: github.event_name == 'push'
        run: git show --check --oneline --no-renames HEAD

  dependency-locks:
    name: Locked dependencies / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify repeated clean installs and hash rejection
        run: python scripts/check_dependency_locks.py
      - name: Install pinned lock generator
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.12'
        run: |
          python -m venv .local/lock-tools
          .local/lock-tools/bin/python -m pip --isolated install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: -r requirements-lock.txt
      - name: Regenerate locks and reject drift
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.12'
        run: |
          python scripts/lock_dependencies.py --uv .local/lock-tools/bin/uv
          git diff --exit-code -- requirements.txt requirements-dev.txt requirements-legacy.txt requirements-lock.txt

  agent-python:
    name: Agent standard library / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check Agent without third-party packages
        run: |
          python -S -m compileall -q agent
          python -S -m agent.main --help
          python -S -m unittest discover -s tests -p test_runtime_engine.py -v
          python -S -m unittest discover -s tests -p test_agent_artifacts.py -v
          python -S -m unittest discover -s tests -p test_agent_bootstrap.py -v
          python -S -m unittest discover -s tests -p test_agent_install_command.py -v
      - name: Verify pinned official source and root staging guards
        if: matrix.python-version == '3.12'
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          document = Path('docs/AGENT_INSTALL.md').read_text(encoding='utf-8')
          commands = [block for block in re.findall(r'```bash\n(.*?)```', document, re.S)
                      if 'PROXYFORGE_BOOTSTRAP' in block]
          command = commands[2]
          assert command.startswith('/usr/bin/python3 -I - check ')
          subprocess.run(['/bin/bash', '-e'], input=command, text=True, check=True, timeout=120)
          PY
          sudo "$(command -v python)" -S -m unittest discover -s tests -p test_agent_bootstrap.py -v
      - name: Build and verify fixed-commit Agent artifacts
        shell: bash
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          output=".local/agent-artifacts/$commit"
          python -S scripts/agent_artifacts.py build --commit "$commit" --output-dir "$output"
          manifest="$output/proxyforge-agent-$commit.manifest.json"
          archive="$output/proxyforge-agent-$commit.tar"
          manifest_sha256=$(python -S -c 'import hashlib,sys; print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())' "$manifest")
          python -S scripts/agent_artifacts.py verify --commit "$commit" \
            --manifest-sha256 "$manifest_sha256" --manifest "$manifest" --archive "$archive"

  agent-installation:
    name: Agent installation / Ubuntu ${{ matrix.ubuntu }} ${{ matrix.arch }} HTTPS
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-22.04, ubuntu: "22.04", arch: amd64}
          - {runner: ubuntu-22.04-arm, ubuntu: "22.04", arch: arm64}
          - {runner: ubuntu-24.04, ubuntu: "24.04", arch: amd64}
          - {runner: ubuntu-24.04-arm, ubuntu: "24.04", arch: arm64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked Controller test dependencies
        run: |
          python -m pip --isolated install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: -r requirements-dev.txt
      - name: Install from console command and verify real HTTPS heartbeat
        # Dedicated disposable VM; never run this on a deployed Agent host.
        run: >-
          sudo env GITHUB_ACTIONS=true "$(command -v python)" scripts/check_agent_installation.py
          --disposable-system-test --expected-ubuntu "${{ matrix.ubuntu }}" --expected-arch "${{ matrix.arch }}"

  controller-image:
    name: Controller image / non-root and recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify non-root startup, permissions, migration and cold recovery
        run: python scripts/check_controller_image.py docker

  singbox-runtime:
    name: sing-box managed runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked Controller dependencies for deployment crypto
        run: |
          python -m pip --isolated install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: -r requirements.txt
          python -m pip check
      - name: Verify pinned binary and real systemd activation and rollback
        # Dedicated disposable runner; script refuses pre-existing unit/account.
        run: sudo "$(command -v python)" scripts/check_singbox_runtime.py --disposable-system-test

  mihomo-compatibility:
    name: Mihomo parser compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and verify pinned official Linux amd64 binary
        run: python scripts/download_mihomo.py --output "$RUNNER_TEMP/mihomo"

      - name: Install application dependencies for the real generator
        run: |
          python -m pip --isolated install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: -r requirements.txt
          python -m pip check

      - name: Confirm binary version and CLI
        run: |
          "$RUNNER_TEMP/mihomo" -v
          "$RUNNER_TEMP/mihomo" -h

      - name: Generate subscription and check configurations without external network access
        # Keep loopback (including IPv6) available, but no external interface.
        # Any unexpected geodata/provider download fails instead of using the network.
        run: |
          sudo unshare --net -- bash -euc '
            ip link set lo up
            "$1" scripts/generate_ci_config.py --output test-results/mihomo/generated-subscription.yaml
            exec "$1" scripts/check_mihomo.py --binary "$2" --log-dir test-results/mihomo \
              --generated-config test-results/mihomo/generated-subscription.yaml
          ' _ "$(command -v python)" "$RUNNER_TEMP/mihomo"

      - name: Upload parser logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-parser-logs
          path: test-results/mihomo/
          if-no-files-found: warn
          retention-days: 7
